name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-ipa
  cancel-in-progress: true
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  SPACE: fdgwse5/sahm-app
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash          # = bash -eo pipefail: a failing check piped into tee still fails the step
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain, icon, project
        run: |
          sw_vers | tee build.log
          xcodebuild -version | tee -a build.log
          brew install xcodegen
          curl -fsSL "https://huggingface.co/spaces/$SPACE/resolve/main/assets/icon-1024.b64" -o icon.b64
          python3 -c "import base64,pathlib; pathlib.Path('Sahm/Assets.xcassets/AppIcon.appiconset/icon-1024.png').write_bytes(base64.b64decode(pathlib.Path('icon.b64').read_text()))"
          sips -g pixelWidth -g pixelHeight Sahm/Assets.xcassets/AppIcon.appiconset/icon-1024.png | tee -a build.log
          xcodegen generate 2>&1 | tee -a build.log

      - name: Pointer check (CryptoKit opens what the PC publishes)
        run: |
          swiftc -parse-as-library -target "$(uname -m)-apple-macosx13.0" Sahm/Pointer.swift ci/PointerCheck.swift -o pointercheck 2>&1 | tee -a build.log
          ./pointercheck 2>&1 | tee -a build.log

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project Sahm.xcodeproj -scheme Sahm -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build >> build.log 2>&1 \
            || { grep -nE "error:|BUILD FAILED" build.log | head -60; exit 1; }
          grep -nE "warning: " build.log | head -40 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sahm.app Payload/
          zip -qry Sahm.ipa Payload
          shasum -a 256 Sahm.ipa | tee Sahm.ipa.sha256
          ls -la Sahm.ipa
          plutil -p Payload/Sahm.app/Info.plist | tee -a build.log

      - name: Simulator run (screenshots)
        continue-on-error: true
        run: |
          exec > >(tee sim-report.txt) 2>&1
          set -x
          xcodebuild -project Sahm.xcodeproj -scheme Sahm -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build > sim-build.log 2>&1 || { grep -nE "error:" sim-build.log | head -40; exit 1; }
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')][0])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" simbuild/Build/Products/Debug-iphonesimulator/Sahm.app
          # 1) first launch, no key: the pairing panel
          xcrun simctl launch "$UDID" com.sahm.app -pointerFile p_ci.json
          sleep 10
          xcrun simctl io "$UDID" screenshot shot-1-first-launch.png
          xcrun simctl terminate "$UDID" com.sahm.app
          # 2) paired (key given as a launch argument = the UserDefaults fallback KeyStore reads):
          #    pointer p_ci.json -> decrypt -> /api/health -> the page loads in the WKWebView
          xcrun simctl launch "$UDID" com.sahm.app -sahm.pairKey ci-dummy-key-0000000000 -pointerFile p_ci.json
          sleep 25
          xcrun simctl io "$UDID" screenshot shot-2-paired-loaded.png
          xcrun simctl terminate "$UDID" com.sahm.app
          # 3) the REAL pointer with a key that cannot open it: red "key no longer valid" + pairing button
          xcrun simctl launch "$UDID" com.sahm.app -sahm.pairKey ci-dummy-key-0000000000 -pointerFile p.json
          sleep 20
          xcrun simctl io "$UDID" screenshot shot-3-real-pointer-wrong-key.png
          # 4) sahm:// is registered: iOS asks to open it in the app
          xcrun simctl openurl "$UDID" "sahm://pair?k=ci-dummy-key-0000000000"
          sleep 6
          xcrun simctl io "$UDID" screenshot shot-4-deeplink-prompt.png

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          FILES="Sahm.ipa Sahm.ipa.sha256"
          for f in shot-*.png sim-report.txt; do if [ -f "$f" ]; then FILES="$FILES $f"; fi; done
          gh release create "$TAG" $FILES --latest --title "سهم $TAG" \
            --notes "IPA غير موقّع: يُثبَّت عبر Sideloadly أو AltStore بحساب Apple ID. البناء من ${{ github.sha }}."

      - name: Failure report
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { grep -nE "error:|fatal|BUILD FAILED|MISMATCH|FAIL" build.log 2>/dev/null | head -120; echo ----; tail -150 build.log 2>/dev/null; } > errors.txt || true
          gh release create "fail-${{ github.run_number }}" errors.txt --prerelease --title "failed ${{ github.run_number }}" --notes "build failed at ${{ github.sha }}"
