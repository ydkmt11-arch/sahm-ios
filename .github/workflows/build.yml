name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-ipa
  cancel-in-progress: true
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  SPACE: fdgwse5/sahm-app
  BID: io.github.ydkmt11arch.sahm
  CI_KEY: ci-dummy-key-0000000000
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash          # = bash -eo pipefail: a failing check piped into tee still fails the step
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain, icon, project
        run: |
          sw_vers | tee build.log
          xcodebuild -version | tee -a build.log
          brew install xcodegen ldid
          curl -fsSL "https://huggingface.co/spaces/$SPACE/resolve/main/assets/icon-1024.b64" -o icon.b64
          python3 -c "import base64,pathlib; pathlib.Path('Sahm/Assets.xcassets/AppIcon.appiconset/icon-1024.png').write_bytes(base64.b64decode(pathlib.Path('icon.b64').read_text()))"
          sips -g pixelWidth -g pixelHeight Sahm/Assets.xcassets/AppIcon.appiconset/icon-1024.png | tee -a build.log
          xcodegen generate 2>&1 | tee -a build.log

      - name: Pointer check (CryptoKit opens what the PC publishes)
        run: |
          swiftc -parse-as-library -target "$(uname -m)-apple-macosx13.0" Sahm/Pointer.swift ci/PointerCheck.swift -o pointercheck 2>&1 | tee -a build.log
          ./pointercheck 2>&1 | tee -a build.log

      - name: Build for iPhone
        run: |
          xcodebuild -project Sahm.xcodeproj -scheme Sahm -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build >> build.log 2>&1 \
            || { grep -nE "error:|Stack dump|While type-checking|Please submit a bug report|Command [A-Za-z]+ failed|BUILD FAILED" build.log | head -60; exit 1; }
          grep -nE "warning: " build.log | head -40 || true

      - name: Fakesign, package, and prove SideStore can sign it
        run: |
          rm -rf Payload && mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sahm.app Payload/
          APP=Payload/Sahm.app
          lipo -info "$APP/Sahm" | tee -a build.log
          plutil -lint "$APP/Info.plist" | tee -a build.log
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BID"
          echo "bundle id $BID, version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" | tee -a build.log
          # SideStore (SideSign AppBundle.name) sends CFBundleDisplayName, else CFBundleName, to Apple as the App ID name;
          # Apple rejects anything but English letters, digits and spaces ("An invalid value 'سهم' ... 'appIdName'").
          for k in CFBundleDisplayName CFBundleName; do
            v=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist")
            echo "$v" | grep -Eq '^[A-Za-z0-9 ]+$' || { echo "::error::$k '$v' is not plain English: SideStore install fails (appIdName)"; exit 1; }
          done
          for l in ar en; do
            plutil -p "$APP/$l.lproj/InfoPlist.strings" | tee -a build.log | grep -q "سهم" || { echo "::error::$l.lproj/InfoPlist.strings has no Arabic name"; exit 1; }
          done
          echo "App ID name '$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")' OK for Apple; home-screen name from ar/en InfoPlist.strings" | tee -a build.log
          codesign --force --sign - --timestamp=none "$APP"
          codesign -dv "$APP" 2>&1 | tee -a build.log
          codesign --verify --deep --strict "$APP" && echo "codesign verify OK" | tee -a build.log
          # free-account signing only: no aps-environment anywhere (a free Apple ID cannot carry it; SideStore would fail)
          if codesign -d --entitlements - "$APP" 2>&1 | grep -q aps-environment || grep -q aps-environment ci/ldid-entitlements.plist; then
            echo "::error::aps-environment found: a free Apple ID cannot sign push"; exit 1; fi
          echo "no aps-environment (free-account signing)" | tee -a build.log
          zip -qry Sahm.ipa Payload
          shasum -a 256 Sahm.ipa | tee Sahm.ipa.sha256
          ls -la Sahm.ipa | tee -a build.log
          # SideStore signs with ldid and the free account's entitlements: the same operation must succeed here
          rm -rf ldidtest && mkdir ldidtest && cp -R "$APP" ldidtest/
          ldid -Sci/ldid-entitlements.plist ldidtest/Sahm.app/Sahm
          ldid -e ldidtest/Sahm.app/Sahm | tee -a build.log | grep -q "application-identifier"
          echo "ldid re-sign with free-account entitlements OK" | tee -a build.log
          # the owner's personal copy, made by the same code the PC uses
          PAIR_KEY="$CI_KEY" PAIR_HINT="https://example.trycloudflare.com" python3 ci/personalize.py Sahm.ipa personal-test.ipa
          rm -rf ptest && mkdir ptest && (cd ptest && unzip -q ../personal-test.ipa)
          test -x ptest/Payload/Sahm.app/Sahm
          python3 -c "import json; d=json.load(open('ptest/Payload/Sahm.app/pair.json')); assert d=={'v':1,'k':'$CI_KEY','u':'https://example.trycloudflare.com'}, d; print('pair.json OK, executable keeps +x')" | tee -a build.log
          codesign --force --sign - --timestamp=none ptest/Payload/Sahm.app
          codesign --verify --deep --strict ptest/Payload/Sahm.app && echo "personal copy re-signs OK" | tee -a build.log

      - name: Simulator - build and boot
        run: |
          xcodebuild -project Sahm.xcodeproj -scheme Sahm -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build > sim-build.log 2>&1 || { grep -nE "error:|Stack dump|While type-checking|Please submit a bug report|Command [A-Za-z]+ failed|BUILD FAILED" sim-build.log | head -40; exit 1; }
          rm -rf simpkg && mkdir -p simpkg/Payload && cp -R simbuild/Build/Products/Debug-iphonesimulator/Sahm.app simpkg/Payload/
          (cd simpkg && zip -qry ../SahmSim.ipa Payload)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')][0])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 2>/dev/null || true
          xcrun simctl list devices | grep "$UDID"

      - name: Simulator - public scenarios
        run: |
          chmod +x ci/sim.sh
          { ci/sim.sh generic && ci/sim.sh personal-ci && ci/sim.sh wrongkey && ci/sim.sh firstlaunch; } 2>&1 | tee sim-report.txt

      - name: Simulator - the owner's live platform (screenshots encrypted)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          python3 -m venv sealenv && sealenv/bin/pip install -q cryptography
          set +e; ci/sim.sh real 2>&1 | tee -a sim-report.txt; rc=${PIPESTATUS[0]}; set -e
          if ls real-*.png >/dev/null 2>&1; then sealenv/bin/python ci/seal.py real-*.png; fi
          exit $rc

      - name: Simulator - deep link (last, its system prompt stays on screen)
        run: ci/sim.sh deeplink 2>&1 | tee -a sim-report.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.5.${{ github.run_number }}"
          FILES="Sahm.ipa Sahm.ipa.sha256 sim-report.txt"
          for f in shot-*.png real-*.png.enc ci-*.json; do if [ -f "$f" ]; then FILES="$FILES $f"; fi; done
          gh release create "$TAG" $FILES --latest --title "سهم $TAG" \
            --notes "Fakesigned IPA, bundle id $BID: SideStore / AltStore / Sideloadly re-sign it with the user's Apple ID. Built from ${{ github.sha }}. Simulator checks passed: generic; personal copy with a built-in interface that updates itself from the server (signed manifest, per-file hashes) and reaches the API through the in-app proxy; wrong key; deep link; the owner's live platform (interface downloaded from the server, the notification feed read natively, admin panel, then offline with the saved copy; screenshots encrypted). v1.5: after the first launch the page shows «لتصلك الإشعارات والتطبيق مقفل» once (simulator scenario personal-ci checks it is asked once and answered): link Telegram in one tap (t.me/<bot>?start=<one-time token>, bound by the bot) or open the Home-Screen Web Push guide in Safari. v1.4: the system notification sheet appears by itself on the first launch (simulator scenario firstlaunch); every install has its own device id and its own preferences on the server; Background App Refresh AND a Background Processing task. A free Apple ID cannot carry aps-environment, so background delivery stays best effort (iOS decides when) - Telegram and Web Push to the interface on the Home Screen are the channels that always arrive while the app is closed."

      - name: Failure report
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { grep -nE "error:|Stack dump|While type-checking|Please submit a bug report|Command [A-Za-z]+ failed|BUILD FAILED|fatal|FAIL|TIMEOUT" build.log sim-build.log sim-report.txt 2>/dev/null | head -150; echo ----; tail -120 build.log 2>/dev/null; } > errors.txt || true
          FILES="errors.txt"
          for f in shot-*.png generic-timeout.png personal-ci-timeout.png wrongkey-timeout.png real-*.png.enc ci-*.json sim-report.txt; do if [ -f "$f" ]; then FILES="$FILES $f"; fi; done
          gh release create "fail-${{ github.run_number }}" $FILES --prerelease --title "failed ${{ github.run_number }}" --notes "build failed at ${{ github.sha }}"
