name: Sahm
options:
  bundleIdPrefix: io.github.ydkmt11arch
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Sahm:
    type: application
    platform: iOS
    sources:
      - path: Sahm
    settings:
      base:
        # Globally unique: "com.sahm.app" is already registered by another Apple developer team, which made
        # SideStore fail with error 3011 ("bundle identifier unavailable / already registered").
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ydkmt11arch.sahm
        PRODUCT_NAME: Sahm
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # header room for the signature load command that SideStore's ldid adds (its "ldid.cpp" error)
        OTHER_LDFLAGS: "-Wl,-headerpad_max_install_names"
schemes:
  Sahm:
    build:
      targets:
        Sahm: all
    run:
      config: Debug
    archive:
      config: Release
